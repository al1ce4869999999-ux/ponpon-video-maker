<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ぽんぽん四コマメーカー 試作版</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#352b22;background:#f8f4ed}
*{box-sizing:border-box}body{margin:0;padding:16px;max-width:900px;margin:auto}h1{font-size:1.5rem}p,small{line-height:1.6}
textarea,input,button{font:inherit;border-radius:9px;border:1px solid #b9a995;padding:10px;max-width:100%}textarea{width:100%;min-height:180px}button{background:#62513e;color:white;border:0;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.panel{background:white;border:1px solid #e0d2c0;border-radius:14px;padding:14px;margin:14px 0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cols label{display:block;font-weight:bold;font-size:.88rem}.cols textarea{min-height:90px;font-size:.9rem}
canvas{width:100%;height:auto;display:block;background:white;border:1px solid #ccc}#info{white-space:pre-line;font-size:.85rem;color:#6e5d4a}input[type=file]{width:100%}
@media(max-width:550px){.cols{grid-template-columns:1fr}}
</style></head><body>
<h1>🦝 ぽんぽん四コマメーカー <small>試作版</small></h1>
<p>Zetaの文章を貼り、四コマの下書きを自動作成。ぽんぽんの正式な透過画像を登録できます。文章・画像は端末内だけで処理します。</p>
<div class="panel"><label for="story">物語</label><textarea id="story" placeholder="*ぽんぽんは道端に座った。*&#10;にんげんに飼ってもらうぽん！&#10;*ぽんぽんは道にぺたーんと寝転がった。*"></textarea>
<div class="controls"><button id="make">四コマを作る</button><button id="save">PNGを保存</button></div>
<label for="image">ぽんぽんの透過画像（任意）</label><input type="file" id="image" accept="image/png,image/webp,image/jpeg">
<p id="info" role="status">正式な素材を登録するまでは、絵の代わりに仮のプレースホルダーを表示します。</p></div>
<div class="panel"><h2>コマの文章（編集可）</h2><div class="cols" id="editors"></div></div>
<div class="panel"><canvas id="comic" width="900" height="2480" aria-label="四コマ漫画プレビュー"></canvas></div>
<script src="../analyzer.js"></script><script>
(()=>{'use strict';
const $=id=>document.getElementById(id), canvas=$('comic'),c=canvas.getContext('2d');
const titles=['① 起：状況','② 承：行動','③ 転：変化','④ 結：結果'];
const W=900,H=2480,cuts=[{},{},{},{}];let avatar=null,drawToken=0;
function wrapText(s,max){let lines=[''];for(const ch of String(s)){let i=lines.length-1;if(ch==='\n'){lines.push('');continue;}if(c.measureText(lines[i]+ch).width>max&&lines[i])lines.push(ch);else lines[i]+=ch;}return lines;}
function caption(txt,x,y,maxWidth,maxLines,size){c.font='bold '+size+'px sans-serif';let lines=wrapText(txt,maxWidth).slice(0,maxLines);lines.forEach((line,i)=>c.fillText(line,x,y+i*(size+10)));}
function draw(){
c.clearRect(0,0,W,H);c.fillStyle='#faf6ee';c.fillRect(0,0,W,H);
c.fillStyle='#3c3025';c.textAlign='center';c.font='bold 48px sans-serif';c.fillText('ぽんぽんの四コマ',W/2,75);
for(let i=0;i<4;i++){const y=112+i*576,h=550;c.fillStyle='#fff';c.fillRect(42,y,816,h);c.strokeStyle='#4b382c';c.lineWidth=6;c.strokeRect(42,y,816,h);
c.fillStyle='#f2e5d4';c.fillRect(48,y+6,804,66);c.fillStyle='#413326';c.font='bold 30px sans-serif';c.textAlign='left';c.fillText(titles[i],72,y+52);
if(avatar){const b={x:265,y:y+96,w:390,h:290},scale=Math.min(b.w/avatar.width,b.h/avatar.height),w=avatar.width*scale,h2=avatar.height*scale;c.drawImage(avatar,b.x+(b.w-w)/2,b.y+(b.h-h2)/2,w,h2)}
else{c.fillStyle='#f7f3ed';c.fillRect(260,y+96,380,290);c.fillStyle='#a28b73';c.textAlign='center';c.font='28px sans-serif';c.fillText('キャラクター画像未登録',450,y+245)}
c.fillStyle='#fff9ef';c.fillRect(74,y+401,752,125);c.strokeStyle='#ad9273';c.lineWidth=2;c.strokeRect(74,y+401,752,125);c.fillStyle='#362b24';c.textAlign='left';
caption(cuts[i].text||'（このコマの描写を入力）',92,y+440,710,3,26);
}
c.textAlign='center';c.fillStyle='#706457';c.font='24px sans-serif';c.fillText('ぽんぽん四コマメーカー・ラフ構成',450,2450);
}
function normalize(text){return String(text||'').replace(/\s+/g,' ').trim();}
function generate(){
const input=$('story').value.trim();if(!input){$('info').textContent='物語を入力してください。';return;}
if(!window.PonponAnalyzer){$('info').textContent='解析エンジンを読み込めませんでした。';return;}
const result=window.PonponAnalyzer.analyze(input,{maxCuts:4});
const shots=result.shots;
for(let i=0;i<4;i++)cuts[i].text=normalize(shots[i]?.text||'');
renderEditors();draw();
$('info').textContent='解析：'+result.report.segments+'ブロック → '+shots.length+'コマ。文章を4コマへ時系列に圧縮した下書きです。\n'+result.report.warnings.join('\n')+'\n※起承転結・オチ・描き分けは未完成。現在は同一画像を全コマへ配置します。';
}
function renderEditors(){$('editors').replaceChildren();cuts.forEach((cut,i)=>{const lab=document.createElement('label');lab.textContent=titles[i];const box=document.createElement('textarea');box.value=cut.text||'';box.setAttribute('aria-label',titles[i]+'の文章');box.addEventListener('input',()=>{cuts[i].text=box.value;draw()});lab.appendChild(box);$('editors').appendChild(lab);});}
$('make').addEventListener('click',generate);$('save').addEventListener('click',()=>{draw();canvas.toBlob(blob=>{if(!blob){$('info').textContent='PNGの生成に失敗しました';return;}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ponpon-four-panel.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)},'image/png')});
$('image').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;if(!f.type.startsWith('image/'))return;
const token=++drawToken;const url=URL.createObjectURL(f);try{const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});if(token!==drawToken)return;avatar=img;draw();$('info').textContent='素材をプレビューに反映しました。原本は変更していません。';}catch(err){$('info').textContent='画像を読み込めませんでした';}finally{URL.revokeObjectURL(url)}});
renderEditors();draw();
})();
</script></body></html>
