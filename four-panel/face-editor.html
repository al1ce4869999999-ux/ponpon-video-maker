<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ぽんぽん四コマ顔表情エディター</title><style>body{font:15px system-ui,sans-serif;background:#faf4eb;color:#453526;max-width:900px;margin:auto;padding:12px}canvas{display:block;width:100%;border:1px solid #c6b9ac;touch-action:none}textarea,select,input,button{font:inherit;padding:8px;border-radius:8px;max-width:100%}textarea{width:100%;box-sizing:border-box}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.panel{padding:13px;margin:12px 0;background:white;border-radius:12px}label{display:block;margin:7px 0}button{background:#64513e;color:white;border:0}input[type=range]{width:100%}</style></head><body><h1>🦝ぽんぽん四コマ 顔表情エディター</h1><p>画像を選択し、各コマの目・眉・口を編集。画像は端末内でのみ処理します。元画像は変更しません。</p><section class="panel"><label>物語<textarea id="story" rows="5" placeholder="Zetaの物語を貼り付け"></textarea></label><label>ぽんぽんの画像（複数選択可）<input id="uploads" type="file" multiple accept="image/*"></label><button id="analyze">四コマを作る</button><p id="status" role="status">画像を登録してください</p></section><section class="panel"><label>編集するコマ<select id="panel"></select></label><div class="controls"><label>イラスト<select id="asset"></select></label><label>表情<select id="mood"></select></label><label>左目<select id="eyeL"></select></label><label>右目<select id="eyeR"></select></label><label>眉<select id="brow"></select></label><label>口<select id="mouth"></select></label><label>調整対象<select id="dragMode"><option value="image">画像全体</option><option value="face">顔全体</option><option value="left">左目</option><option value="right">右目</option><option value="mouth">口</option></select></label><label>強さ<input id="strength" type="range" min="0" max="100" value="70"></label><label>赤み<input id="blush" type="range" min="0" max="100" value="20"></label><label>顔位置X<input id="faceX" type="range" min="-200" max="200" value="0"></label><label>顔位置Y<input id="faceY" type="range" min="-200" max="200" value="0"></label></div><label>文章<textarea id="caption" rows="3"></textarea></label><label>表情プリセット名<input id="presetName" placeholder="例：どやぽん"></label><button id="presetSave">表情を保存</button><label>プリセット<select id="preset"></select></label><button id="presetApply">選択プリセットを適用</button><label>この表情の文章判定にプリセットを連動<select id="linkMood"></select></label><button id="presetLink">連動設定</button></section><section class="panel"><canvas id="canvas" width="900" height="2400"></canvas><button id="png">PNGを書き出す</button><button id="json">JSONバックアップ</button><label>JSON復元<input type="file" id="import" accept=".json,application/json"></label></section><script src="../analyzer.js"></script><script src="./face-editor.js"></script></body></html>
